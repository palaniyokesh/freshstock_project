version: '3.8'

services:
  freshstock-web:
    build: .
    container_name: freshstock_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=replace_with_secure_random_key_in_production
      - PORT=5000
    volumes:
      - freshstock_data:/app/data
    restart: unless-stopped

volumes:
  freshstock_data:
